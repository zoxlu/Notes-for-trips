<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名古屋行程地圖</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }

  #map {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
  }

  #controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    max-width: min(60vw, calc(100vw - 20px));
  }

  #controls button {
    padding: 7px 12px;
    border: none;
    border-radius: 6px;
    font: 13px system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
    background: rgba(255, 255, 255, .95);
    color: #333;
    /* 手機上點擊目標至少 36px 高,避免誤觸 */
    min-height: 36px;
  }

  #controls .sep {
    width: 1px;
    background: #ccc;
    margin: 0 4px;
  }

  #legend {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 10;
    background: rgba(255, 255, 255, .95);
    padding: 12px 14px;
    border-radius: 8px;
    font: 13px/1.6 system-ui, sans-serif;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
  }

  #legend .swatch {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-right: 6px;
  }

  #legend .hint {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
    font-size: 12px;
    color: #666;
  }

  #legend .keys { color: #999; }

  /* 手機:圖例改到左下角並縮小,鍵盤快捷鍵提示直接隱藏(觸控裝置沒有鍵盤) */
  @media (max-width: 640px) {
    #controls {
      max-width: calc(100vw - 20px);
      gap: 5px;
    }
    #controls button {
      padding: 6px 9px;
      font-size: 12px;
    }
    #legend {
      top: auto;
      right: auto;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 10px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    #legend .keys { display: none; }
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="controls"></div>
<div id="legend"></div>

<script src="https://unpkg.com/deck.gl@9.0.0/dist.min.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script>
const HOME = {
  name: '住宿(榮)',
  position: [136.9080, 35.1709]    // TODO: 飯店確定後改成實際座標
};

const TYPE_COLORS = {
  'place':       [ 76, 124, 176],
  'food':        [214,  90,  60],
  'supermarket': [ 96, 154, 108],
};
const TYPE_LABELS = { 'place': '景點', 'food': '美食', 'supermarket': '超市' };
const RESTROOM_COLOR = [150, 100, 190];

// ── 狀態 ──
// filter 可能是: 'all' | 'planned' | 'Day1' ... 'Day7'
let allSpots = [];
let filter = 'all';
let days = [];
let overlay = null;
let map = null;
let showArcs = true;
let showRestrooms = false;

const isPlanned = d => d.days?.length > 0;

// 這筆資料在目前的篩選下,是不是「被強調」的?
function isActive(d) {
  if (filter === 'all')     return isPlanned(d);
  if (filter === 'planned') return isPlanned(d);
  return d.days?.includes(filter);        // 單日模式
}

// 這筆資料在目前的篩選下,要不要顯示?
function isVisible(d) {
  if (filter === 'all')     return true;
  if (filter === 'planned') return isPlanned(d);
  return true;                            // 單日模式:其他點淡化但保留(當作候選參考)
}

function buildLayers() {
  const data = allSpots.filter(isVisible);

  // ── 路線推算 ──
  const arcs = [];
  if (showArcs && filter !== 'all' && filter !== 'planned') {
    const dayPoints = allSpots.filter(d => d.days?.includes(filter));

    if (dayPoints.length > 0) {
      const dist = (a, b) => Math.hypot(
        a.position[0] - b.position[0],
        a.position[1] - b.position[1]
      );
      const remaining = [...dayPoints];
      let current = HOME;
      const route = [HOME];

      while (remaining.length > 0) {
        let nearestIdx = 0, nearestDist = Infinity;
        remaining.forEach((p, i) => {
          const d = dist(current, p);
          if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
        });
        current = remaining.splice(nearestIdx, 1)[0];
        route.push(current);
      }
      route.push(HOME);

      for (let i = 0; i < route.length - 1; i++) {
        arcs.push({ from: route[i], to: route[i + 1], step: i });
      }
    }
  }
  const arcCount = Math.max(arcs.length, 1);

  // ── 廁所:從目前顯示的點裡收集,並去重 ──
  const restrooms = [];
  if (showRestrooms) {
    const seen = new Set();
    for (const spot of data.filter(isActive)) {
      for (const r of (spot.restrooms ?? [])) {
        const key = r.position.join(',');
        if (seen.has(key)) continue;
        seen.add(key);
        restrooms.push({ ...r, near: spot.name });
      }
    }
  }

  return [
    new deck.ArcLayer({
      id: 'arcs',
      data: arcs,
      getSourcePosition: d => d.from.position,
      getTargetPosition: d => d.to.position,
      getSourceColor: d => {
        const t = d.step / arcCount;
        return [255, Math.round(210 * (1 - t)), 60, 210];
      },
      getTargetColor: d => {
        const t = (d.step + 1) / arcCount;
        return [255, Math.round(210 * (1 - t)), 60, 210];
      },
      getWidth: 3,
      getHeight: 0.35,
      updateTriggers: {
        getSourcePosition: [filter, showArcs],
        getTargetPosition: [filter, showArcs],
        getSourceColor: [filter, showArcs],
        getTargetColor: [filter, showArcs]
      }
    }),

    new deck.ScatterplotLayer({
      id: 'restrooms',
      data: restrooms,
      getPosition: d => d.position,
      getRadius: 45,
      getFillColor: [...RESTROOM_COLOR, 200],
      radiusMinPixels: 3,
      radiusMaxPixels: 8,
      stroked: true,
      getLineColor: [255, 255, 255, 230],
      lineWidthMinPixels: 1,
      pickable: true,
      updateTriggers: {
        getPosition: [filter, showRestrooms]
      }
    }),

    new deck.ScatterplotLayer({
      id: 'spots',
      data,
      getPosition: d => d.position,
      getRadius: d => isActive(d) ? 170 : 55,
      getFillColor: d => {
        const c = TYPE_COLORS[d.type] ?? [120, 120, 120];
        return isActive(d) ? [...c, 235] : [...c, 55];
      },
      getLineColor: d => isActive(d) ? [255, 255, 255, 255] : [255, 255, 255, 50],
      radiusMinPixels: 4,
      radiusMaxPixels: 22,
      stroked: true,
      lineWidthMinPixels: 1.5,
      pickable: true,
      transitions: { getRadius: 300, getFillColor: 300, getLineColor: 300 },
      updateTriggers: {
        getRadius: filter,
        getFillColor: filter,
        getLineColor: filter
      }
    }),

    new deck.ScatterplotLayer({
      id: 'home',
      data: [HOME],
      getPosition: d => d.position,
      getRadius: 200,
      getFillColor: [40, 40, 40, 240],
      radiusMinPixels: 7,
      radiusMaxPixels: 14,
      stroked: true,
      getLineColor: [255, 255, 255],
      lineWidthMinPixels: 2,
      pickable: true
    }),

    new deck.TextLayer({
      id: 'labels',
      data: data.filter(isActive),
      getPosition: d => d.position,
      getText: d => d.name,
      getColor: [35, 35, 35, 255],
      getPixelOffset: [0, -16],
      fontFamily: '"Noto Sans JP", "Noto Sans TC", system-ui, sans-serif',
      characterSet: 'auto',
      sizeUnits: 'meters',
      getSize: 120,
      sizeMinPixels: 10,
      sizeMaxPixels: 17,
      background: true,
      getBackgroundColor: [255, 255, 255, 215],
      backgroundPadding: [5, 2, 5, 2],
      getTextAnchor: 'middle',
      getAlignmentBaseline: 'bottom',
      updateTriggers: {
        getText: filter,
        getPosition: filter
      }
    })
  ];
}

// 手機沒有右側圖例、螢幕也窄,padding 要跟著縮,否則 fitBounds 會把範圍壓到看不見
function fitPadding() {
  const narrow = window.innerWidth <= 640;
  return narrow
    ? { top: 70, bottom: 90, left: 30, right: 30 }
    : { top: 80, bottom: 80, left: 80, right: 240 };
}

function fitToFilter() {
  let pts;
  if (filter === 'all') {
    pts = allSpots.map(d => d.position);
  } else if (filter === 'planned') {
    pts = allSpots.filter(isPlanned).map(d => d.position);
  } else {
    pts = allSpots.filter(d => d.days?.includes(filter)).map(d => d.position);
    pts.push(HOME.position);          // 單日模式把住宿也框進去
  }

  if (pts.length === 0) return;

  // 算邊界框:找出最小/最大的經緯度
  const lngs = pts.map(p => p[0]);
  const lats = pts.map(p => p[1]);
  const bounds = [
    [Math.min(...lngs), Math.min(...lats)],   // 西南角
    [Math.max(...lngs), Math.max(...lats)]    // 東北角
  ];

  map.fitBounds(bounds, {
    padding: fitPadding(),
    maxZoom: 15,
    duration: 800
  });
}

function setFilter(f) {
  filter = f;
  overlay.setProps({ layers: buildLayers() });
  updateButtons();
  fitToFilter();
}

function updateButtons() {
  document.querySelectorAll('#controls button[data-filter]').forEach(btn => {
    const on = btn.dataset.filter === filter;
    btn.style.background = on ? '#c0563c' : '';
    btn.style.color      = on ? '#fff' : '';
    btn.style.fontWeight = on ? '600' : '';
  });
  document.querySelectorAll('#controls button[data-toggle]').forEach(btn => {
    const on = btn.dataset.toggle === 'arcs' ? showArcs : showRestrooms;
    btn.style.background = on ? '#4a7c9c' : '';
    btn.style.color      = on ? '#fff' : '';
  });
}

function buildButtons() {
  const controls = document.getElementById('controls');
  const items = [
    { key: 'all',     label: '全部' },
    { key: 'planned', label: '已排行程' },
    ...days.map(d => ({ key: d, label: d.replace('Day', 'D') }))
  ];

  controls.innerHTML = items.map(it => {
    const n = it.key === 'all'
      ? allSpots.length
      : it.key === 'planned'
        ? allSpots.filter(isPlanned).length
        : allSpots.filter(s => s.days?.includes(it.key)).length;

    return `<button data-filter="${it.key}">${it.label} <span style="opacity:.6;font-size:11px;">${n}</span></button>`;
  }).join('') + `
    <span class="sep"></span>
    <button data-toggle="arcs">路線</button>
    <button data-toggle="restrooms">🚻 廁所</button>`;

  controls.querySelectorAll('button[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  controls.querySelectorAll('button[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.toggle === 'arcs') showArcs = !showArcs;
      else showRestrooms = !showRestrooms;
      overlay.setProps({ layers: buildLayers() });
      updateButtons();
    });
  });
}

function buildLegend() {
  document.getElementById('legend').innerHTML =
    '<b>分類</b><br/>' +
    Object.entries(TYPE_COLORS).map(([k, c]) =>
      `<div><span class="swatch" style="background:rgb(${c.join(',')});"></span>${TYPE_LABELS[k]}</div>`
    ).join('') +
    `<div><span class="swatch" style="background:rgb(${RESTROOM_COLOR.join(',')});width:9px;height:9px;"></span>公廁</div>` +
    `<div class="hint">實心 = 目前選取<br/>淡色 = 其他<br/>
       <span class="keys">0 全部 · 空白 已排 · 1-7 天數<br/>A 路線 · R 廁所 · H 對焦</span>
     </div>`;
}

async function init() {
  const res = await fetch('spots.json');
  if (!res.ok) {
    document.getElementById('legend').textContent = `讀取 spots.json 失敗(${res.status})`;
    return;
  }
  allSpots = await res.json();

  // 從資料自動抓出有哪些天,並排序
  days = [...new Set(allSpots.flatMap(s => s.days ?? []))].sort();
  console.log(`載入 ${allSpots.length} 筆,天數:`, days);

  map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [136.9066, 35.1755],
    zoom: 12
  });

  overlay = new deck.MapboxOverlay({
    layers: buildLayers(),
    getTooltip: ({ object, layer }) => {
      if (!object) return null;
      if (layer.id === 'restrooms') {
        return {
          html: `🚻 <b>${object.name ?? '公廁'}</b><br/>
                 <span style="color:#666;">${object.near} 附近 · ${object.distance ?? ''}</span>`,
          style: { fontSize: '13px', padding: '8px', lineHeight: '1.5' }
        };
      }
      return {
        html: `<b>${object.name}</b><br/>
               ${TYPE_LABELS[object.type] ?? ''} · ${object.district ?? ''}<br/>
               ${isPlanned(object) ? '📅 ' + object.days.join(', ') : '⚪ 候選中'}
               ${object.interest ? ' · 興致 ' + object.interest : ''}`,
        style: { fontSize: '13px', padding: '8px', lineHeight: '1.5' }
      };
    }
  });
  map.addControl(overlay);

  buildButtons();
  updateButtons();
  buildLegend();

  // 鍵盤:0=全部, 空白=已排, 1-7=各天
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setFilter('planned'); return; }
    if (e.key === '0')      { setFilter('all'); return; }
    if (e.key === 'h' || e.key === 'H') { fitToFilter(); return; }
    if (e.key === 'a' || e.key === 'A') {
      showArcs = !showArcs;
      overlay.setProps({ layers: buildLayers() });
      updateButtons();
      return;
    }
    if (e.key === 'r' || e.key === 'R') {
      showRestrooms = !showRestrooms;
      overlay.setProps({ layers: buildLayers() });
      updateButtons();
      return;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) {
      const target = `Day${n}`;
      if (days.includes(target)) setFilter(target);
    }
  });
}

init();
</script>
</body>
</html>
